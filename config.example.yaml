# Copy to config.yaml and edit.
cv_path: profile/cv.pdf
profile_path: profile/profile.yaml

search:
  titles: ["software engineer", "backend engineer", "full stack"]   # a job must mention one of these/keywords
  keywords: ["python", "typescript"]
  exclude_title_words: ["intern", "junior", "manager", "director"]
  remote_only: true
  min_score: 4          # AI fit score 1-5; only jobs >= this get a cover letter and an application
  max_years_gap: 2      # skip jobs asking for more than (your years of experience + this)
  blacklist_companies: []

sources:
  starter_companies: true   # ~40 verified company boards (Greenhouse/Lever/Ashby); add more with `sidekick add-company`
  hn: true              # latest "Ask HN: Who is hiring?" thread
  remoteok: true
  remotive: true
  wwr: true             # We Work Remotely (RSS)
  himalayas: true
  jobicy: true
  arbeitnow: true
  adzuna: false         # free key; set ADZUNA_APP_ID / ADZUNA_APP_KEY
  adzuna_country: us
  workingnomads: true
  themuse: true
  nodesk: true
  linkedin_guest: false  # OPT-IN: LinkedIn's public logged-out search (no login; against LinkedIn's terms; rate-limited). You apply by hand.
  linkedin_location: Worldwide
  boards: {}            # extra company boards by system, e.g. {workable: [huggingface], recruitee: [bunq]}
  jobspy: false         # OPT-IN scraping (Indeed/LinkedIn/Glassdoor/ZipRecruiter/BDJobs); against their terms, your risk. uv sync --extra scrape
  jobspy_sites: [indeed]
  jobspy_country: usa
  jsearch: false        # RAPIDAPI_KEY; Google-for-Jobs aggregate = LinkedIn/Indeed/Glassdoor listings, applied on the employer site
  serpapi: false        # SERPAPI_KEY
  greenhouse: []        # company board slugs, e.g. ["stripe", "gitlab"]
  lever: []             # e.g. ["netflix"]
  ashby: []             # e.g. ["linear"]

apply:
  mode: review          # review = AI fills the form, you confirm each Submit.  auto = AI submits by itself
  max_per_run: 10
  headless: false       # keep false so you can watch it
  skip_domains: ["linkedin.com"]   # LinkedIn bans automation; these are listed for you to apply to by hand

models:
  match: claude-haiku-5-5
  write: claude-sonnet-5-5
  browser: claude-sonnet-5-5

llm:
  provider: anthropic   # anthropic | openai | gemini | ollama (free, local) | custom (any OpenAI-compatible URL)
  base_url: ""
  api_key_env: ""

email:
  via: auto             # auto = Gmail drafts if credentials.json exists, else a mailto link

resume:
  enabled: true         # tailored one-job PDF resume (facts from your CV only)

notify:
  desktop: true         # macOS banner; Telegram/Slack turn on with env vars (see .env.example)
  followup_days: 7
