[project]
name = "jobsidekick"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.125.0",
    "browser-use>=0.11.13",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "playwright>=1.64.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
sidekick = "jobsidekick.cli:app"

[project.optional-dependencies]
scrape = [
    "python-jobspy>=1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobsidekick"]

[tool.pytest.ini_options]
pythonpath = ["."]
